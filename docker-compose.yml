services:
  frontend:
    container_name: ${FRONTEND_CONTAINER_NAME:-frontend_portifolio_ltd} 
    build:
      context: .
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_INTERNAL_PORT:-5173}"
    restart: always
    volumes:
      - .:/root/app 
      - /root/app/node_modules
    
      


